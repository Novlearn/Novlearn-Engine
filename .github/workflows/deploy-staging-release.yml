name: Deploy Engine release to staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-staging-deploy
  cancel-in-progress: false
jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
    permissions:
      contents: read
      deployments: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Deploy the exact Engine 0.2.1 image to staging
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_ENVIRONMENT: staging
          IMAGE_REFERENCE: ghcr.io/novlearn/novlearn-engine-host@sha256:d1916edf981fd23b57f543937d83411df77b7dc5da290e24db9f41cbf544a4ea
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_ENVIRONMENT,IMAGE_REFERENCE,GHCR_USER,GHCR_TOKEN
          script_path: deploy/deploy-remote.sh
          command_timeout: 15m
