name: Deploy Engine release to staging
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Engine release tag, for example v0.2.1
        required: true
        type: string
      confirmation:
        description: Type DEPLOY STAGING followed by the exact version tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: engine-staging-deploy
  cancel-in-progress: false
jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
    permissions:
      contents: read
      deployments: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate the published release and explicit staging confirmation
        id: image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CONFIRMATION" == "DEPLOY STAGING $VERSION" ]] || {
            echo 'Staging deployment requires confirmation of the exact release tag.' >&2
            exit 1
          }
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/$owner/novlearn-engine-host"
          gh release download "$VERSION" --pattern engine-image.txt --dir "$RUNNER_TEMP"
          reference="$(cat "$RUNNER_TEMP/engine-image.txt")"
          [[ "$reference" =~ ^ghcr\.io/${owner}/novlearn-engine-host@sha256:[a-f0-9]{64}$ ]]
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
      - name: Calculate the reviewed staging helper fingerprint
        id: staging-helper
        run: echo "sha256=$(sha256sum deploy/engine-deploy-root.sh | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Prepare a private temporary helper directory
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          HELPER_DIR: /tmp/novlearn-engine-staging-helper-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: HELPER_DIR
          script: |
            set -eu
            [[ "$HELPER_DIR" =~ ^/tmp/novlearn-engine-staging-helper-[0-9]+-[0-9]+$ ]]
            [[ ! -e "$HELPER_DIR" ]]
            mkdir -m 0700 -- "$HELPER_DIR"
      - name: Upload the reviewed helper
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/engine-deploy-root.sh
          target: /tmp/novlearn-engine-staging-helper-${{ github.run_id }}-${{ github.run_attempt }}
          strip_components: 1
          overwrite: true
      - name: Install and verify the stage-only helper
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          HELPER_DIR: /tmp/novlearn-engine-staging-helper-${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_SHA256: ${{ steps.staging-helper.outputs.sha256 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: HELPER_DIR,EXPECTED_SHA256
          script: |
            set -euo pipefail
            [[ "$HELPER_DIR" =~ ^/tmp/novlearn-engine-staging-helper-[0-9]+-[0-9]+$ ]]
            [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
            cleanup() { sudo -n rm -rf -- "$HELPER_DIR"; }
            trap cleanup EXIT
            source_file="$HELPER_DIR/engine-deploy-root.sh"
            [[ -f "$source_file" && ! -L "$source_file" ]]
            sudo -n install -o root -g root -m 0755 "$source_file" /usr/local/sbin/novlearn-engine-deploy-staging
            actual_sha256="$(sudo -n sha256sum /usr/local/sbin/novlearn-engine-deploy-staging | cut -d' ' -f1)"
            [[ "$actual_sha256" == "$EXPECTED_SHA256" ]]
      - name: Deploy the selected published Engine release to staging
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_ENVIRONMENT: staging
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_ENVIRONMENT,IMAGE_REFERENCE,GHCR_USER,GHCR_TOKEN
          script_path: deploy/deploy-staging-remote.sh
          command_timeout: 15m
