services:
  engine:
    image: ${ENGINE_IMAGE:?ENGINE_IMAGE must be a GHCR image digest}
    restart: unless-stopped
    init: true
    read_only: true
    user: '1000:1000'
    environment:
      PORT: '8080'
      PYTHONDONTWRITEBYTECODE: '1'
      ENGINE_API_TOKEN: ${ENGINE_API_TOKEN:?ENGINE_API_TOKEN is required}
    ports:
      - '127.0.0.1:${HOST_PORT:?HOST_PORT is required}:8080'
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 64
    cpus: 1.5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m,uid=1000,gid=1000,mode=0700
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 10s
